name: TrackPriceApp
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Features:
    path: Features

targets:
  TrackPriceApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TrackPriceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackprice.app
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: TrackPriceApp/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Features
        product: Features
