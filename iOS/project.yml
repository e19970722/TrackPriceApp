name: TrackPriceApp
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  TrackPriceApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TrackPriceApp
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackprice.app
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: TrackPriceApp/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: ComposableArchitecture
      - package: GoogleSignIn

  TrackPriceAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TrackPriceAppTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: TrackPriceApp
      - package: ComposableArchitecture
